<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة Ibnalarabstore</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f5f6f8;color:#171717}.wrap{max-width:1100px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:18px 0}input,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button,a.btn{background:#111827;color:#fff;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}.danger{background:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item{border:1px solid #eee;border-radius:12px;padding:12px}.muted{color:#667085;font-size:13px}.order{border-top:1px solid #eee;padding:14px 0}</style></head><body><main class="wrap"><div class="head"><div><h1>لوحة إدارة Ibnalarabstore</h1><div class="muted">إدارة المنتجات والطلبات على هذا المتصفح</div></div><a class="btn" href="index.html">عرض المتجر</a></div><section class="card"><h2>إضافة منتج</h2><input id="name" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر بالليرة التركية"><input id="cat" placeholder="القسم"><input id="emoji" placeholder="رمز المنتج، مثال: 🛍️"><textarea id="desc" placeholder="وصف مختصر"></textarea><button onclick="addProduct()">إضافة المنتج</button></section><section class="card"><h2>المنتجات</h2><div id="products" class="grid"></div></section><section class="card"><h2>الطلبات</h2><div id="orders"></div></section></main><script>const key='ibn_products';let products=JSON.parse(localStorage.getItem(key)||'[]');if(!products.length)products=[{id:1,name:'منتج مميز 1',cat:'العروض',price:120,emoji:'🛍️',desc:'منتج مختار بعناية'},{id:2,name:'منتج مميز 2',cat:'الجديد',price:180,emoji:'✨',desc:'جودة ممتازة وسعر مناسب'}];const money=n=>new Intl.NumberFormat('tr-TR').format(n)+' ل.ت';function save(){localStorage.setItem(key,JSON.stringify(products));render()}function addProduct(){let name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value),cat=document.getElementById('cat').value.trim()||'عام',emoji=document.getElementById('emoji').value.trim()||'🛍️',desc=document.getElementById('desc').value.trim();if(!name||!price){alert('أدخل اسم المنتج والسعر.');return}products.push({id:Date.now(),name,price,cat,emoji,desc});['name','price','cat','emoji','desc'].forEach(id=>document.getElementById(id).value='');save()}function del(id){products=products.filter(p=>p.id!==id);save()}function render(){document.getElementById('products').innerHTML=products.map(p=>`<div class="item"><div style="font-size:38px">${p.emoji}</div><b>${p.name}</b><div class="muted">${p.cat}</div><div>${money(p.price)}</div><p class="muted">${p.desc||''}</p><button class="danger" onclick="del(${p.id})">حذف</button></div>`).join('')||'<p>لا توجد منتجات.</p>';let orders=JSON.parse(localStorage.getItem('ibn_orders')||'[]').reverse();document.getElementById('orders').innerHTML=orders.map(o=>`<div class="order"><b>طلب #${o.id}</b><p>الاسم: ${o.name}<br>الهاتف: ${o.phone}<br>العنوان: ${o.address}</p><div class="muted">${new Date(o.date).toLocaleString('ar')}</div></div>`).join('')||'<p>لا توجد طلبات بعد.</p>'}render();</script></body></html>
